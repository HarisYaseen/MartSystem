<!DOCTYPE html>
<html>
<head>
    <title>Mart Management - Sales History</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../assets/js/common.js"></script>
</head>
<body>
    <div class="sidebar">
        <h2><i data-lucide="layout-grid"></i> MartOS</h2>
                <div class="nav-group">
            <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
            <a href="pos.html" class="nav-item"><i data-lucide="shopping-cart"></i> POS Terminal</a>
            <a href="products.html" class="nav-item"><i data-lucide="package"></i> Products</a>
            <a href="inventory.html" class="nav-item"><i data-lucide="boxes"></i> Inventory</a>
            <a href="suppliers.html" class="nav-item"><i data-lucide="users"></i> Suppliers</a>
            <a href="purchase_orders.html" class="nav-item"><i data-lucide="file-text"></i> Purchase Orders</a>
            <a href="sales.html" class="nav-item active"><i data-lucide="history"></i> Sales History</a>
            <a href="reports.html" class="nav-item"><i data-lucide="bar-chart-3"></i> Reports</a>
            <a href="settings.html" class="nav-item"><i data-lucide="settings"></i> Settings</a>
        </div>
    </div>

    <div class="main">
        <div class="header">
            <div>
                <h1>Sales History</h1>
                <p style="color: var(--text-muted); font-size: 0.875rem;">Review past sales transactions and receipts.</p>
            </div>
        </div>

        <div class="content">
            <div class="card">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Receipt #</th>
                                <th>Amount</th>
                                <th>Method</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="sales-list"></tbody>
                    </table>
                </div>
                <!-- Pagination Controls -->
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px; border-top: 1px solid var(--border);">
                    <div style="font-size: 0.875rem; color: var(--text-muted);">
                        Showing page <span id="current-page-num" style="font-weight: 600; color: var(--text);">1</span> 
                        of <span id="total-pages-num">1</span>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn btn-outline" id="prev-btn" onclick="changePage(-1)" disabled><i data-lucide="chevron-left"></i> Previous</button>
                        <button class="btn btn-outline" id="next-btn" onclick="changePage(1)">Next <i data-lucide="chevron-right"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Items Modal -->
    <div id="items-modal" class="modal">
        <div class="modal-content" style="width: 600px;">
            <div class="modal-header">
                <div>
                    <h2 style="margin: 0;">Sale Details</h2>
                    <p id="items-subtitle" style="color: var(--text-muted); font-size: 0.875rem; margin-top: 4px;"></p>
                </div>
                <button class="btn btn-outline" style="padding: 5px; border: none;" onclick="hideItemsModal()"><i data-lucide="x"></i></button>
            </div>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Quantity</th>
                            <th>Unit Price</th>
                            <th>Subtotal</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="items-list"></tbody>
                </table>
            </div>

            <div class="modal-footer" style="margin-top: 24px; justify-content: space-between;">
                <button id="modal-refund-btn" class="btn btn-danger" style="display: none;">Full Refund Receipt</button>
                <button class="btn btn-primary" onclick="hideItemsModal()">Close</button>
            </div>
        </div>
    </div>


    <script>
        lucide.createIcons();
        let currentPage = 1;
        const pageSize = 20;

        async function loadSales() {
            const totalSales = await handleIPC('get-sales-count');
            const totalPages = Math.ceil(totalSales / pageSize) || 1;
            
            document.getElementById('total-pages-num').innerText = totalPages;
            document.getElementById('current-page-num').innerText = currentPage;
            
            // Enable/Disable buttons
            document.getElementById('prev-btn').disabled = currentPage <= 1;
            document.getElementById('next-btn').disabled = currentPage >= totalPages;

            const sales = await handleIPC('get-sales-history', { page: currentPage, pageSize });
            const list = document.getElementById('sales-list');
            list.innerHTML = '';
            
            sales.forEach(s => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${s.created_at}</td>
                    <td style="font-weight: 600;">${s.receipt_number}</td>
                    <td style="font-weight: 700;">Rs ${s.net_amount.toLocaleString()}</td>
                    <td><span class="badge badge-gray">${s.payment_method}</span></td>
                    <td>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn btn-outline" style="padding: 5px 12px;" onclick="viewItems(${s.id}, '${s.receipt_number}')">Details</button>
                            <button class="btn btn-danger" style="padding: 5px 12px;" onclick="refundSale(${s.id}, '${s.receipt_number}')">Refund</button>
                        </div>
                    </td>
                `;
                list.appendChild(tr);
            });
            lucide.createIcons();
        }

        function changePage(delta) {
            currentPage += delta;
            loadSales();
        }

        async function refundSale(saleId, receiptNo) {
            const res = await handleIPC('refund-sale', saleId);
            if (res.success) {
                showToast('Full sale refunded and stock updated.', 'success');
                hideItemsModal();
                loadSales();
            }
        }

        async function returnItem(saleId, itemId, productId, quantity, unitPrice, name) {
            const res = await handleIPC('return-sale-item', { saleId, itemId, productId, quantity, unitPrice });
            if (res.success) {
                showToast(`Returned ${quantity}x ${name} to stock.`, 'success');
                const receiptNo = document.getElementById('items-subtitle').innerText.split(': ')[1];
                viewItems(saleId, receiptNo);
                loadSales();
            }
        }

        async function viewItems(saleId, receiptNo) {
            document.getElementById('items-subtitle').innerText = 'Receipt: ' + receiptNo;
            const items = await window.electron.invoke('get-sale-items', saleId);
            const list = document.getElementById('items-list');
            list.innerHTML = '';
            
            items.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: 600;">
                        ${item.product_name}
                        <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: normal;">${item.barcode}</div>
                    </td>
                    <td>${item.quantity}</td>
                    <td>Rs ${item.unit_price.toLocaleString()}</td>
                    <td style="font-weight: 600;">Rs ${item.subtotal.toLocaleString()}</td>
                    <td>
                        <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.75rem;" onclick="returnItem(${saleId}, ${item.id}, ${item.product_id}, ${item.quantity}, ${item.unit_price}, '${item.product_name}')">Return</button>
                    </td>
                `;
                list.appendChild(tr);
            });

            // Add full refund button to modal footer
            const footer = document.querySelector('.modal-footer');
            footer.innerHTML = `
                <button class="btn btn-danger" style="margin-right: auto;" onclick="refundSale(${saleId}, '${receiptNo}')">Full Refund</button>
                <button class="btn btn-primary" onclick="hideItemsModal()">Close</button>
            `;
            
            document.getElementById('items-modal').style.display = 'flex';
            lucide.createIcons();
        }

        function hideItemsModal() {
            document.getElementById('items-modal').style.display = 'none';
        }

        loadSales();
    </script>
</body>
</html>

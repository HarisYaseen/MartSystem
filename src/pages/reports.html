<!DOCTYPE html>
<html>
<head>
    <title>Mart Management - Reports</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .report-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-top: 24px; }
        .chart-container { height: 350px; position: relative; margin-top: 20px; }
        .table-container { margin-top: 24px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2><i data-lucide="layout-grid"></i> MartOS</h2>
                <div class="nav-group">
            <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
            <a href="pos.html" class="nav-item"><i data-lucide="shopping-cart"></i> POS Terminal</a>
            <a href="products.html" class="nav-item"><i data-lucide="package"></i> Products</a>
            <a href="inventory.html" class="nav-item"><i data-lucide="boxes"></i> Inventory</a>
            <a href="suppliers.html" class="nav-item"><i data-lucide="users"></i> Suppliers</a>
            <a href="purchase_orders.html" class="nav-item"><i data-lucide="file-text"></i> Purchase Orders</a>
            <a href="sales.html" class="nav-item"><i data-lucide="history"></i> Sales History</a>
            <a href="reports.html" class="nav-item active"><i data-lucide="bar-chart-3"></i> Reports</a>
            <a href="settings.html" class="nav-item"><i data-lucide="settings"></i> Settings</a>
        </div>
    </div>

    <div class="main">
        <div class="header">
            <div>
                <h1>Sales & Performance Reports</h1>
                <p style="color: var(--text-muted); font-size: 0.875rem;">Analyze your business trends and performance.</p>
            </div>
        </div>

        <div class="content">
            <div class="card" style="margin-bottom: 24px;">
                <div style="display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;">
                    <div class="form-group" style="margin:0; flex:1; min-width:200px;">
                        <label>Report Type</label>
                        <select id="report-range" onchange="handleRangeChange()">
                            <option value="daily">Daily Report</option>
                            <option value="weekly">Weekly Report</option>
                            <option value="monthly">Monthly Report</option>
                            <option value="custom">Custom Date Range</option>
                        </select>
                    </div>
                    <div id="custom-dates" style="display: none; gap: 15px; flex: 2; min-width:300px;">
                        <div class="form-group" style="margin:0; flex:1;">
                            <label>From</label>
                            <input type="date" id="date-from">
                        </div>
                        <div class="form-group" style="margin:0; flex:1;">
                            <label>To</label>
                            <input type="date" id="date-to">
                        </div>
                    </div>
                    <button class="btn btn-primary" style="padding: 12px 24px;" onclick="renderReport()">Generate Report</button>
                    <button class="btn btn-outline" onclick="window.print()" style="padding: 12px 24px;"><i data-lucide="printer"></i> Print</button>
                </div>
            </div>

            <div id="report-content">
                <!-- Content will be injected here -->
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let mainChart = null;

        function handleRangeChange() {
            const range = document.getElementById('report-range').value;
            document.getElementById('custom-dates').style.display = range === 'custom' ? 'flex' : 'none';
            if (range !== 'custom') renderReport();
        }

        async function renderReport() {
            const range = document.getElementById('report-range').value;
            const from = document.getElementById('date-from').value;
            const to = document.getElementById('date-to').value;

            const container = document.getElementById('report-content');
            container.innerHTML = `<div style="display:flex; justify-content:center; padding:50px;"><i data-lucide="loader-2" class="spin" style="width:32px; height:32px; color:var(--primary);"></i></div>`;
            lucide.createIcons();

            const data = await window.electron.invoke('get-report-data', { range, from, to });
            
            if (!data.success) {
                container.innerHTML = `
                    <div class="card" style="text-align:center; padding:50px;">
                        <i data-lucide="alert-circle" style="width:48px; height:48px; color:var(--danger); margin-bottom:15px;"></i>
                        <h3>Failed to load report</h3>
                        <p style="color:var(--text-muted);">${data.error}</p>
                        <button class="btn btn-primary" style="margin-top:20px;" onclick="renderReport()">Retry</button>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            const margin = data.net > 0 ? ((data.profit / data.net) * 100).toFixed(1) : 0;
            
            container.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-info">
                            <div class="stat-label">Transactions</div>
                            <div class="stat-value">${data.transactions}</div>
                        </div>
                        <div class="stat-icon" style="background: #eff6ff; color: #3b82f6;"><i data-lucide="shopping-cart"></i></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-info">
                            <div class="stat-label">Net Revenue</div>
                            <div class="stat-value">Rs ${data.net.toLocaleString()}</div>
                        </div>
                        <div class="stat-icon" style="background: #f0fdf4; color: #10b981;"><i data-lucide="banknote"></i></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-info">
                            <div class="stat-label">Total Discounts</div>
                            <div class="stat-value">Rs ${data.discount.toLocaleString()}</div>
                        </div>
                        <div class="stat-icon" style="background: #fef2f2; color: #ef4444;"><i data-lucide="percent"></i></div>
                    </div>
                </div>

                <div class="stats-grid" style="margin-top: 24px;">
                    <div class="stat-card">
                        <div class="stat-info">
                            <div class="stat-label">Stock Purchases (Expenses)</div>
                            <div class="stat-value" style="color: var(--danger);">Rs ${(data.totalPurchases || 0).toLocaleString()}</div>
                        </div>
                        <div class="stat-icon" style="background: #fff1f2; color: #e11d48;"><i data-lucide="trending-down"></i></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-info">
                            <div class="stat-label">Net Profit (After COGS)</div>
                            <div class="stat-value" style="color: var(--primary);">Rs ${(data.profit || 0).toLocaleString()}</div>
                            <div style="font-size: 0.75rem; color: var(--success); font-weight: 600; margin-top: 4px;">Margin: ${margin}%</div>
                        </div>
                        <div class="stat-icon" style="background: #eff6ff; color: #3b82f6;"><i data-lucide="trending-up"></i></div>
                    </div>
                </div>

                <div class="report-grid" style="margin-bottom: 24px;">
                    <div class="card">
                        <h3>Sales Trend (Last 30 Days)</h3>
                        <div class="chart-container" style="height: 300px;"><canvas id="trendsChart"></canvas></div>
                    </div>
                    <div class="card">
                        <h3>Category Breakdown</h3>
                        <div class="chart-container" style="height: 300px;"><canvas id="categoryChart"></canvas></div>
                    </div>
                </div>

                <div class="card">
                    <h3 style="margin-bottom:20px;">Detailed Sales Summary</h3>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Receipt #</th>
                                    <th>Date & Time</th>
                                    <th>Method</th>
                                    <th>Total</th>
                                    <th>Discount</th>
                                    <th>Net Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.sales.length ? data.sales.map(s => `
                                    <tr>
                                        <td style="font-weight:600;">${s.receipt_number}</td>
                                        <td>${new Date(s.created_at).toLocaleString()}</td>
                                        <td><span class="badge badge-gray">${s.payment_method}</span></td>
                                        <td>Rs ${s.total_amount.toLocaleString()}</td>
                                        <td style="color:var(--danger);">-Rs ${s.discount.toLocaleString()}</td>
                                        <td style="font-weight:700;">Rs ${s.net_amount.toLocaleString()}</td>
                                    </tr>
                                `).join('') : '<tr><td colspan="6" style="text-align:center; padding:40px; color:var(--text-muted);">No sales data found for this period.</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            
            // Render Charts
            renderAnalytics();
            lucide.createIcons();
        }

        async function renderAnalytics() {
            const trends = await window.electron.invoke('get-sales-analytics');
            const categories = await window.electron.invoke('get-category-sales');
            
            // Trends Chart
            const tCtx = document.getElementById('trendsChart').getContext('2d');
            if (window.trendsChartObj) window.trendsChartObj.destroy();
            window.trendsChartObj = new Chart(tCtx, {
                type: 'line',
                data: {
                    labels: trends.map(d => d.date),
                    datasets: [{
                        label: 'Revenue',
                        data: trends.map(d => d.revenue),
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        fill: true, tension: 0.4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            // Category Chart
            const cCtx = document.getElementById('categoryChart').getContext('2d');
            if (window.categoryChartObj) window.categoryChartObj.destroy();
            window.categoryChartObj = new Chart(cCtx, {
                type: 'doughnut',
                data: {
                    labels: categories.map(d => d.category),
                    datasets: [{
                        data: categories.map(d => d.revenue),
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        }

        async function updateBusinessName() {
            const settings = await window.electron.invoke('get-settings');
            if (settings.mart_name) {
                const title = document.querySelector('.sidebar h2');
                if (title) title.innerHTML = `<i data-lucide="layout-grid"></i> ${settings.mart_name}`;
                lucide.createIcons();
            }
        }

        renderReport();
        updateBusinessName();
    </script>
</body>
</html>
